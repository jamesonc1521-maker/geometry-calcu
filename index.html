<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantsWeb Ultra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0c0c10;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #calculator {
      width: 100%;
      max-width: 340px;
      background: #15151c;
      border-radius: 24px;
      padding: 24px;
    }
    #display {
      background: #0a0a0e;
      color: #22c55e;
      font-size: 2.3rem;
      text-align: right;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      font-family: monospace;
      min-height: 70px;
      overflow-x: auto;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }
    .keys button {
      border: none;
      border-radius: 12px;
      padding: 17px 0;
      font-size: 1.25rem;
      cursor: pointer;
      background: #1c1c26;
      color: white;
    }
    .keys button.op { background: #252532; color: #22c55e; }
    .keys button.eq { background: #22c55e; color: #000; font-weight: 700; }
    .keys button.clear { background: #ef4444; }

    #app {
      display: none;
      width: 100%;
      max-width: 1100px;
      background: #15151c;
      border-radius: 20px;
      overflow: hidden;
      flex-direction: column;
      min-height: 90vh;
    }
    header {
      background: #1c1c26;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 1.35rem; color: #22c55e; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button {
      background: transparent;
      border: 1px solid #333;
      color: #a1a1aa;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
    }
    nav button.active { background: #22c55e; color: #000; border-color: #22c55e; }

    main { flex: 1; padding: 20px; overflow-y: auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .welcome { text-align: center; padding: 60px 20px; }
    .welcome h2 { font-size: 2.4rem; color: #22c55e; margin-bottom: 10px; }
    .welcome p { color: #71717a; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
